name: PULSO CHAÑAR · motor territorial

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update-radar.py"
      - "scripts/territory-graph.py"
      - "scripts/pulse-history.py"
      - "scripts/audit-radar.py"
      - ".github/workflows/radar-territorial.yml"

concurrency:
  group: pulso-chanar-territorial
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Actualizar señales
        run: python scripts/update-radar.py
      - name: Construir grafo territorial
        run: python scripts/territory-graph.py
      - name: Auditar precisión del pulso
        run: python scripts/audit-radar.py
      - name: Construir memoria histórica
        run: python scripts/pulse-history.py
      - name: Validar contrato de salida
        run: |
          python -m py_compile scripts/update-radar.py scripts/territory-graph.py scripts/audit-radar.py scripts/pulse-history.py
          python - <<'PY'
          import json
          with open("data/radar-feed.json", encoding="utf-8") as f:
              d=json.load(f)
          required=["updatedAt","environment","systemRadars","sourceRegistry","stats","events","territorialGraph","audit"]
          missing=[k for k in required if k not in d]
          if missing:
              raise SystemExit("Contrato RADAR incompleto: " + ", ".join(missing))
          if len(d["systemRadars"]) != 12:
              raise SystemExit(f"Se esperaban 12 radares y hay {len(d['systemRadars'])}")
          print("RADAR OK:", d["updatedAt"], "| radares=", len(d["systemRadars"]), "| hechos=", len(d["events"]))
          PY
      - name: Guardar pulso
        run: |
          git config user.name "PULSO CHAÑAR"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar-feed.json data/pulse-history.json
          git diff --cached --quiet || git commit -m "chore: actualizar Pulso Chañar y grafo territorial"
          git push
