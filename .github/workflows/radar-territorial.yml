name: PULSO CHAÑAR · motor territorial

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update-radar.py"
      - "scripts/territory-graph.py"
      - "scripts/pulse-history.py"
      - "scripts/audit-radar.py"
      - ".github/workflows/radar-territorial.yml"

concurrency:
  group: pulso-chanar-territorial
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Actualizar señales
        run: python scripts/update-radar.py
      - name: Construir grafo territorial
        run: python scripts/territory-graph.py
      - name: Auditar precisión del pulso
        run: python scripts/audit-radar.py
      - name: Construir memoria histórica
        run: python scripts/pulse-history.py
      - name: Diagnóstico temporal del feed
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/radar-feed.json",encoding="utf-8"))
          print("DEBUG sourceContracts",len(d.get("sourceContracts",{})),list(d.get("sourceContracts",{}).keys()))
          print("DEBUG systemRadars",len(d.get("systemRadars",[])),[x.get("id") for x in d.get("systemRadars",[])])
          print("DEBUG required",["updatedAt","environment","operational","sourceContracts","systemRadars","sourceRegistry","stats","events","territorialGraph","audit"])
          print("DEBUG missing",[k for k in ["updatedAt","environment","operational","sourceContracts","systemRadars","sourceRegistry","stats","events","territorialGraph","audit"] if k not in d])
          PY
      - name: Guardar feed de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-feed-debug
          path: data/radar-feed.json
          if-no-files-found: warn
      - name: Validar contrato de salida
        run: |
          python -m py_compile scripts/update-radar.py scripts/territory-graph.py scripts/audit-radar.py scripts/pulse-history.py
          python - <<'PY'
          import json
          with open("data/radar-feed.json", encoding="utf-8") as f:
              d=json.load(f)
          required=["updatedAt","environment","operational","sourceContracts","systemRadars","sourceRegistry","stats","events","territorialGraph","audit"]
          missing=[k for k in required if k not in d]
          if missing:
              raise SystemExit("Contrato RADAR incompleto: " + ", ".join(missing))
          if len(d["systemRadars"]) != 12:
              raise SystemExit(f"Se esperaban 12 radares y hay {len(d['systemRadars'])}")
          if len(d["sourceContracts"]) != 12:
              raise SystemExit(f"Se esperaban 12 contratos de fuentes y hay {len(d['sourceContracts'])}")
          if {r["id"] for r in d["systemRadars"]} != set(d["sourceContracts"]):
              raise SystemExit("Cada radar debe tener exactamente un contrato de fuentes")
          print("RADAR OK:", d["updatedAt"], "| radares=", len(d["systemRadars"]), "| hechos=", len(d["events"]))
          PY
      - name: Guardar pulso
        run: |
          git config user.name "PULSO CHAÑAR"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar-feed.json data/pulse-history.json
          git diff --cached --quiet || git commit -m "chore: actualizar Pulso Chañar y grafo territorial"
          git push
